project_id = "divine-india"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "in.divineindia.customer://login-callback",
  "in.divineindia.admin://login-callback",
  "in.divineindia.operations://login-callback"
]

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.create-booking]
verify_jwt = true

[functions.assign-booking]
verify_jwt = true

[functions.update-booking-progress]
verify_jwt = true
